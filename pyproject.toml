[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-pathway-learning"
version = "0.1.0"
description = "Constrained graph learning of symptom-to-mechanism pathways over a compartmentalized physiology graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
descriptors = ["rdkit>=2024.3", "fair-esm>=2.0"]
graph = ["cobra>=0.29", "omnipath>=1.0", "decoupler>=1.5", "chembl_webresource_client>=0.10", "networkx>=3.0", "pyarrow>=14"]
dev = ["pytest>=7.4", "ruff>=0.4", "ijson>=3.2"]  # ijson: experiments/extract_brenda_enzyme_regulation.py, imported by the regex audit test
# the experiment scripts' own imports, which the technology audit of 16 October 2026 found declared in no extra:
# scipy (the measurement scripts), h5py (build_dopaminergic_expression.py, the descriptors stage), matplotlib (the
# figures), beautifulsoup4, openpyxl and pdfplumber (the exposure-source transcriptions)
experiments = ["scipy>=1.11", "h5py>=3.9", "matplotlib>=3.8", "beautifulsoup4>=4.12", "openpyxl>=3.1", "pdfplumber>=0.11"]

[tool.setuptools.packages.find]
include = ["mechanistic_pathway_learning*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# pinned: with no selection the rule set is the installed ruff's default, which moved from 40 to 690 findings between
# ruff versions without a line changing (the technology audit of 16 October 2026)
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

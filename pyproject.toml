[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-pathway-learning"
version = "0.1.0"
description = "Constrained graph learning of symptom-to-mechanism pathways over a compartmentalized physiology graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
descriptors = ["rdkit>=2024.3", "fair-esm>=2.0"]
graph = ["cobra>=0.29", "omnipath>=1.0", "decoupler>=1.5", "chembl_webresource_client>=0.10", "networkx>=3.0", "pyarrow>=14"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["mechanistic_pathway_learning*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

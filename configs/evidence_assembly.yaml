# Perturbation-symptom evidence (design sections 4.2 and 4.3)
symptom_crosswalk: docs/symptom_crosswalk.csv
curated_pathway_modules: docs/curated_pathway_modules.csv
monogenic:
  hpo_annotations: data/raw/hpo/genes_to_phenotype.txt
  hpo_ontology: data/raw/hpo/hp.obo
  grade_a_requires: {independent_case_series_count: 2, or_omim_clinical_synopsis: true}
pharmacological:
  sider_directory: data/raw/sider_4.1          # time slice: labels to 2015
  onsides_directory: data/raw/onsides          # time slice: current labels
  require_cns_penetration: true
  dominant_target_affinity_margin_fold: 10
  include_relieves_relation: true              # indications as relief evidence; decision pending (open question 5)
literature:
  sources: [pubtator3, ctd]                    # semmeddb once a UMLS license is in place
  role: soft_prior_only
genetics:
  role: validation_only                        # version 2: soft prior
  gwas_summary_statistics: data/raw/gwas/symptom_level/
weighting:                           # not read by assemble_evidence_table.py: its command line is authoritative
                                     # (--weighting grade is the default and the fixed_grades mode below; mode learned_reliability
                                     # is the --weighting reliability arm, with --report-rubric-weights and --reliability-global-scale)
  mode: learned_reliability          # or fixed_grades (fallback and ablation arm)
  reliability_model:                 # evidence_reliability_model.py: Dawid-Skene with Beta priors
    sources: [hpo_monogenic, sider_label, onsides_label, pubtator3, ctd, semmeddb]
    sensitivity_prior_counts: [8, 2]
    specificity_prior_counts: [8, 2]
    use_rubric_features: true        # Raykar-style per-item sensitivity from the LLM appraisal rubric
    global_scale: 1.0                # the only weight hyperparameter tuned on validation folds
    anchor_maximum_pseudo_count: 99  # posterior 0.99 -> 99 pseudo-observations
  llm_appraisal:                     # llm_evidence_appraisal.py: document-grounded rubric, never a truth judgment
    model_name: to_be_pinned_before_preregistration
    prompt_version: appraisal-rubric-v1
    temperature: 0.0
    cache_directory: data/cache/llm_appraisal
    gold_set: docs/appraisal_gold_set.csv   # two human raters; kappa per field reported before use
    minimum_kappa_to_use_field: 0.6
  fixed_grades:                      # used when mode is fixed_grades
    grade_weights: {A: 1.0, B: 0.6, C: 0.0, D: 0.2, E: 0.05}
    predication_weights: {CAUSES: 0.10, DISRUPTS: 0.08, PREDISPOSES: 0.08, AFFECTS: 0.08, ASSOCIATED_WITH: 0.05, COMENTION: 0.02}
positive_target: 0.99        # label smoothing for observed links: the "0.99 no-change" policy
negative_sampling:
  degree_matched: true
  negatives_per_positive: 5
  negative_weight: 0.2       # unobserved pairs are not confirmed negatives
output_directory: data/processed/evidence
